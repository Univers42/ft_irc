# ---------------------------------------------------------------------------
# scenario_default.conf — a scripted conversation, replayed in the background
# once every client is connected and joined.
#
#   <delay-seconds> <nick> <raw IRC line>
#
# The delay is relative to the previous line, so the whole file reads as a
# timeline. Lines are sent as raw IRC and work identically against an nc
# client and a HexChat GUI (HexChat gets them via /quote).
#
# Replace this file, or point --scenario at another one, to simulate a
# different day.
# ---------------------------------------------------------------------------

0.5  alice  PRIVMSG #general :morning all
0.4  bob    PRIVMSG #general :morning
0.6  carol  PRIVMSG #general :anyone looking at the parser bug?
0.5  bob    PRIVMSG #dev :carol is asking about the parser
0.4  dave   PRIVMSG #dev :i have a branch for it
0.8  alice  TOPIC #dev :parser bug — dave has a branch
0.5  erin   PRIVMSG #general :is #dev the right room for that?
0.4  grace  PRIVMSG #general :yes, #dev
0.6  alice  MODE #ops +i
0.5  frank  PRIVMSG #ops :locking the room, good
0.5  judy   JOIN #ops
0.6  heidi  PRIVMSG #random :anyone here?
0.5  grace  PRIVMSG #random :always
0.7  judy   PRIVMSG alice :can i join #ops?
0.5  alice  PRIVMSG judy :it is invite only, one moment
0.4  alice  INVITE judy #ops
0.5  judy   JOIN #ops
0.4  judy   PRIVMSG #ops :thanks
0.8  bob    PRIVMSG #dev :pushing the fix now
0.5  ivan   PRIVMSG #dev :reviewing
0.6  alice  MODE #dev +t
0.5  alice  TOPIC #dev :parser bug — fix under review
