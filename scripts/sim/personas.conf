# ---------------------------------------------------------------------------
# personas.conf — the cast of the simulation. Edit this file to change the
# whole environment; nothing else needs touching.
#
#   nick | client | channels | role | realname
#
#   nick      <= 9 chars. The server advertises NICKLEN=9 and TRUNCATES past
#             it, so "probeclient" would silently become "probeclie" and stop
#             answering to its own name. simulation.sh refuses a roster that
#             would be truncated.
#   client    nc | hexchat | auto
#             auto  -> nc, unless --hexchat N promotes it (roster order).
#   channels  comma-separated, or - for a lurker that connects and joins
#             nothing.
#   role      op | user
#             Ops connect first, so the first op listing a channel creates it
#             and owns it; any other op on that channel is then given +o.
#
# The default cast is built to exercise the interesting overlaps: shared
# channels, private-only users, a lurker, an over-subscribed channel, and a
# user who is op in one room and an ordinary member in another.
# ---------------------------------------------------------------------------

