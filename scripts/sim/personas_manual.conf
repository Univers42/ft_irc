# Roster for `make man_sim` — the hand-driven sandbox.
#
# Bigger than personas.conf on purpose. personas.conf is sized for the
# automated probes (small, deterministic, every persona load-bearing for some
# assertion); this one is sized for a human poking at the server, so it wants
# enough traffic and enough rooms that JOIN, NAMES, WHO, MODE and PRIVMSG all
# have something real to say.
#
#   nick | client | channels | role | realname
#
#   nick      <= 9 chars. The server advertises NICKLEN=9 and TRUNCATES past
#             it, so "probeclient" would silently become "probeclie" and stop
#             answering to its own name. simulation.sh refuses a roster that
#             would be truncated.
#   client    nc | hexchat | auto   (auto -> nc unless --hexchat N promotes it)
#   channels  comma-separated, or - for a lurker that connects and joins
#             nothing
#   role      op | user. Ops are given +o in every channel they join, so
#             there is always someone who can demonstrate KICK/INVITE/TOPIC
#             and someone who cannot.
#
# ── the rooms ────────────────────────────────────────────────────────────
#   #general   everyone; the busy one
#   #dev       engineering; two ops
#   #ops       small and op-heavy
#   #random    chatter
#   #support   a help desk shape: one op, several users
#   #music     mid-size, no op present -> +t and +o behave differently here
#   #games     mid-size
#   #linux     mid-size
#   #42        digits in a channel name
#   #void      exactly one occupant; empties the moment they PART
#   #lurkers   nobody joins it -- JOIN it yourself and you are alone and +o

