# Roster for `make man_sim` — the hand-driven sandbox and the autonomous
# ecosystem that runs on top of it.
#
# This file decides WHO CONNECTS and WHAT THE SERVER GRANTS THEM.
# scripts/sim/ecosystem.conf decides how they BEHAVE. The two are keyed by
# nickname and must agree on spelling; nothing else couples them.
#
#   nick | client | channels | role | realname
#
#   nick      <= 9 chars. The server advertises NICKLEN=9 and TRUNCATES past
#             it, so "probeclient" would silently become "probeclie" and stop
#             answering to its own name. simulation.sh refuses a roster that
#             would be truncated. ("GrumpyBot" is exactly 9 — on the boundary
#             on purpose.)
#   client    nc | hexchat | auto   (auto -> nc unless --hexchat N promotes it)
#   channels  comma-separated, or - for a lurker that connects and joins
#             nothing
#   role      op | user — this is the SERVER-SIDE grant. simulation.sh sends
#             MODE +o for every `op`, and the first client into a channel gets
#             +o from the server for creating it.
#
#             This is NOT the same thing as the behavioural role in
#             ecosystem.conf, and the difference is deliberate: HappyBot is a
#             `moderator` there and a plain `user` here, so it will try to
#             moderate and be refused with 482. A bot must not be able to
#             award itself a privilege the server never granted, and the only
#             honest way to prove that is to have one try.
#
# ── the rooms ────────────────────────────────────────────────────────────
#   #general   everyone; the busy one
#   #dev       engineering, two ops
#   #ops       small and op-heavy
#   #random    chatter
#   #support   a help-desk shape, no op present
#   #games     mid-size
#   #linux     mid-size
#   #files     FileBot's archive
#   #secret    OpBot alone — the room people get invited into
#   #void      exactly one occupant; empties the moment they PART
#   #lurkers   nobody joins it — JOIN it yourself and you are alone and +o

# --- people -------------------------------------------------------------
