# Google style as an adopted baseline of good practices, overridden wherever
# 42's subject and C++98 take priority (they always do).
#
# Filtered (each a higher-authority conflict, not laziness):
#   legal/copyright      — no copyright header required in 42 projects.
#   build/include_subdir — Google-monorepo include-path convention, N/A here.
#   build/header_guard   — Google wants path-based guards (INCLUDE_CLIENT_HPP_).
#                          42's CPP modules expect header/source name parity
#                          (Client.hpp <-> Client.cpp) and short guards; there
#                          are no same-name headers across dirs to collide, so
#                          the path convention solves a problem we don't have.
#   runtime/references   — const-ref params are idiomatic C++; Google's
#                          pointer-for-mutables rule is a house preference.
#   runtime/int          — fixed-width types aren't guaranteed in strict C++98;
#                          the subject uses int/size_t/time_t.
#   whitespace/indent_namespace
#                        — a false positive, not a conflict of taste. The rule
#                          reads clang-format's 4-space *continuation* indent on
#                          a member-initializer list or braced array — the tail
#                          line ending in `{}` or `}};` — as a namespace-body
#                          indent. clang-format owns layout in this repo and
#                          reports every flagged file clean; every current hit
#                          was verified by hand to be such a tail line.
# Kept and applied: include_order, explicit ctors, brace symmetry, IWYU.
set noparent
filter=-legal/copyright,-build/include_subdir,-build/header_guard,-runtime/references,-runtime/int,-whitespace/indent_namespace
linelength=80
