# ─────────────────────────────────────────────────────────────────────────────
#  ft_irc in a container.
#
#    docker compose up --build
#
#  The image is the subject binary and nothing else: ircserv <port> <password>.
# ─────────────────────────────────────────────────────────────────────────────

services:
  ircserv:
    build:
      context: .
      dockerfile: Dockerfile
    image: ft_irc/ircserv
    command: ["6667", "${IRC_SERVER_PASSWORD:-changeme}"]
    ports:
      - "${IRC_PORT:-6667}:6667"
    restart: unless-stopped
