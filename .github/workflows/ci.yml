name: CI

# Runs on every push to main and on every pull-request update. (A push to a
# branch with an open PR triggers the pull_request event, so feature branches
# are covered without double-running.) workflow_dispatch is there so a branch
# without a PR yet can still be put through the whole suite on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every gate this repo has, one job each, so a red X names the thing that
# broke instead of "CI failed":
#
#   build      three tiers compile under -Werror, and `make` does not relink
#   unit       the Google Test suite (in-process, C++17)
#   blackbox   the shell suite against a real ./ircserv over TCP
#   audit      subject compliance (C++98, no fork/exec, one poll site) + style
#   norm       clang-format / clang-tidy / cpplint / cppcheck
#   valgrind   leak gate, scripted and under the functional load
#   docker     the shipped images, plus the suite run inside one
#
# The submodules are public but their URLs are spelled SSH in places, so every
# job rewrites to HTTPS before fetching. Each job initialises only what it
# uses: the build needs libcpp and googletest, and norm additionally needs
# vendor/scripts, because norminette.sh lives there.
#
# Not initialised, deliberately: libcpp's OWN nested scripts submodule, which
# holds check_header_cycles.py. libcpp pins it at 5ba3135f, a commit that was
# never pushed to Univers42/scripts, so `--init --recursive vendor/libcpp`
# fails outright ("not our ref"). audit.sh degrades to a warn when the checker
# is absent, so leaving it out keeps the job green with the cycle gate marked
# skipped -- strictly better than a red job. To actually run that gate, repoint
# libcpp's nested submodule at a pushed commit and bump the libcpp pointer here.
jobs:
  build:
    name: build — 3 tiers, -Werror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: fetch build submodules (public, over HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # A gitlink pointing at a commit that was never pushed fails as
          # "upload-pack: not our ref <sha>", naming neither the submodule nor
          # the cause. Diagnose AFTER the fetch rather than before: a valid
          # gitlink is often a commit deep in history, which `git ls-remote`
          # does not list, so a pre-check on ref tips reports false failures.
          if ! git submodule update --init vendor/libcpp vendor/googletest; then
            for sm in vendor/libcpp vendor/googletest; do
              want="$(git ls-tree HEAD "$sm" | awk '{print $3}')"
              url="$(git config -f .gitmodules --get submodule."$sm".url)"
              echo "::error::$sm wants $want from $url"
            done
            echo "::error::if that commit is local-only, push it to its remote"
            exit 1
          fi
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      # Strictly sequential — never concurrent. Unbounded parallel tier builds
      # are what swap-freeze low-headroom machines; verify-tiers serialises.
      - name: mandatory + bonus + full, in sequence
        run: make verify-tiers
      # The subject forbids an unnecessary relink. Prove it directly rather
      # than trusting the audit's grep: build twice, demand the second is a
      # no-op. `make all`, never bare `make` — the default goal is `help`.
      - name: a second `make all` must be a no-op
        run: |
          make all >/dev/null
          out="$(make all 2>&1)"
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qE '\.o$|LINK'; then
            echo "::error::second 'make all' relinked"; exit 1
          fi
      - name: everything generated lives under build/
        run: |
          make fclean
          make all >/dev/null
          stray="$(find . -path ./vendor -prune -o -path ./build -prune -o \
                   \( -name '*.o' -o -name '*.d' \) -print)"
          if [ -n "$stray" ]; then
            echo "::error::object files outside build/:"; echo "$stray"; exit 1
          fi
          test -x build/bin/ircserv || { echo "::error::no build/bin/ircserv"; exit 1; }
          test -L ircserv || { echo "::error::./ircserv symlink missing"; exit 1; }

  unit:
    name: unit — Google Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: fetch build submodules (public, over HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # A gitlink pointing at a commit that was never pushed fails as
          # "upload-pack: not our ref <sha>", naming neither the submodule nor
          # the cause. Diagnose AFTER the fetch rather than before: a valid
          # gitlink is often a commit deep in history, which `git ls-remote`
          # does not list, so a pre-check on ref tips reports false failures.
          if ! git submodule update --init vendor/libcpp vendor/googletest; then
            for sm in vendor/libcpp vendor/googletest; do
              want="$(git ls-tree HEAD "$sm" | awk '{print $3}')"
              url="$(git config -f .gitmodules --get submodule."$sm".url)"
              echo "::error::$sm wants $want from $url"
            done
            echo "::error::if that commit is local-only, push it to its remote"
            exit 1
          fi
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      # In-process protocol suites (MODE matrix, USER matrix, conformance,
      # security, integration, extensions, file transfer, libcpp).
      - name: make test
        run: make test
      # The suites that bind sockets are timing-sensitive; a single flake
      # should not fail the build, but a REPEATABLE failure must. Re-run the
      # runner once more with the shuffle on to catch order dependencies.
      - name: re-run shuffled (order-dependence check)
        run: |
          make -C tests build
          ./build/bin/test_runner --gtest_shuffle

  blackbox:
    name: blackbox — shell suite over TCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: fetch build submodules (public, over HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # A gitlink pointing at a commit that was never pushed fails as
          # "upload-pack: not our ref <sha>", naming neither the submodule nor
          # the cause. Diagnose AFTER the fetch rather than before: a valid
          # gitlink is often a commit deep in history, which `git ls-remote`
          # does not list, so a pre-check on ref tips reports false failures.
          if ! git submodule update --init vendor/libcpp vendor/googletest; then
            for sm in vendor/libcpp vendor/googletest; do
              want="$(git ls-tree HEAD "$sm" | awk '{print $3}')"
              url="$(git config -f .gitmodules --get submodule."$sm".url)"
              echo "::error::$sm wants $want from $url"
            done
            echo "::error::if that commit is local-only, push it to its remote"
            exit 1
          fi
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential netcat-openbsd procps strace
      - name: build
        run: make all
      # run_all.sh starts one long-lived ./ircserv and drives every numbered
      # suite against it: startup/argv, registration (incl. the USER matrix),
      # TCP framing, disconnect, PRIVMSG, JOIN/PART, KICK/INVITE/TOPIC, the
      # MODE matrix, malformed pre-registration input, and multi-client
      # stress. --skip-build because 12_build_norm.sh runs its own `make re`,
      # which the build job already covers.
      - name: tests/run_all.sh
        working-directory: tests
        run: bash run_all.sh --skip-build
      # 12_build_norm.sh on its own: make all/re/clean/fclean, a warning-free
      # rebuild, and the no-fork/one-poll-site source checks.
      - name: build + norm shell gate
        working-directory: tests
        run: bash 12_build_norm.sh
      # The server must never fork or spawn a thread. Assert it on the live
      # process rather than only by grepping the sources.
      - name: no fork/exec/clone at runtime
        run: |
          ./build/bin/ircserv 6699 ci-pass >/tmp/srv.log 2>&1 &
          srv=$!
          sleep 1
          kids="$(pgrep -P "$srv" || true)"
          threads="$(ls /proc/$srv/task | wc -l)"
          kill "$srv" 2>/dev/null || true
          echo "children: [$kids]  threads: $threads"
          [ -z "$kids" ] || { echo "::error::server forked a child"; exit 1; }
          [ "$threads" -eq 1 ] || { echo "::error::server is multi-threaded"; exit 1; }

  audit:
    name: audit — subject compliance + style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: fetch build submodules (public, over HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # A gitlink pointing at a commit that was never pushed fails as
          # "upload-pack: not our ref <sha>", naming neither the submodule nor
          # the cause. Diagnose AFTER the fetch rather than before: a valid
          # gitlink is often a commit deep in history, which `git ls-remote`
          # does not list, so a pre-check on ref tips reports false failures.
          if ! git submodule update --init vendor/libcpp vendor/googletest; then
            for sm in vendor/libcpp vendor/googletest; do
              want="$(git ls-tree HEAD "$sm" | awk '{print $3}')"
              url="$(git config -f .gitmodules --get submodule."$sm".url)"
              echo "::error::$sm wants $want from $url"
            done
            echo "::error::if that commit is local-only, push it to its remote"
            exit 1
          fi
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 clang-format
      - name: audit — builds mandatory + bonus + full, subject checks
        run: bash scripts/audit.sh
      - name: style — whitespace gate (clang-format advisory)
        run: bash scripts/normalize.sh --check

  norm:
    name: norm — clang-tidy / cpplint / cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: fetch build submodules (public, over HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # A gitlink pointing at a commit that was never pushed fails as
          # "upload-pack: not our ref <sha>", naming neither the submodule nor
          # the cause. Diagnose AFTER the fetch rather than before: a valid
          # gitlink is often a commit deep in history, which `git ls-remote`
          # does not list, so a pre-check on ref tips reports false failures.
          mods="vendor/libcpp vendor/googletest vendor/scripts"
          if ! git submodule update --init $mods; then
            for sm in $mods; do
              want="$(git ls-tree HEAD "$sm" | awk '{print $3}')"
              url="$(git config -f .gitmodules --get submodule."$sm".url)"
              echo "::error::$sm wants $want from $url"
            done
            echo "::error::if that commit is local-only, push it to its remote"
            exit 1
          fi
      # `make norm` reports a tool that is not installed as "skipped" rather
      # than failing, so installing all four is what makes this gate mean
      # anything at all.
      - name: install the four analysers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 python3-pip clang-format clang-tidy cppcheck
          pip3 install --user cpplint
      # NORM_FILES defaults to src + include -- this repository's own code.
      # vendor/libcpp is a submodule with four standing findings of its own,
      # and CI re-inits it from the committed pointer, so a fix made here
      # could never reach this job. See the note on NORM_FILES in the Makefile.
      - name: make norm
        run: make norm
      # clang-format is not merely advisory here: the whole tree is formatted
      # at ColumnLimit 120, and a file that drifts out of it silently breaks
      # the cpplint linelength gate that is pinned to the same number.
      - name: formatting is already applied
        run: |
          make norm-fix >/dev/null
          if ! git diff --quiet -- src include; then
            echo "::error::run 'make norm-fix' and commit the result"
            git diff --stat -- src include
            exit 1
          fi

  valgrind:
    name: valgrind — leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: fetch build submodules (public, over HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # A gitlink pointing at a commit that was never pushed fails as
          # "upload-pack: not our ref <sha>", naming neither the submodule nor
          # the cause. Diagnose AFTER the fetch rather than before: a valid
          # gitlink is often a commit deep in history, which `git ls-remote`
          # does not list, so a pre-check on ref tips reports false failures.
          if ! git submodule update --init vendor/libcpp vendor/googletest; then
            for sm in vendor/libcpp vendor/googletest; do
              want="$(git ls-tree HEAD "$sm" | awk '{print $3}')"
              url="$(git config -f .gitmodules --get submodule."$sm".url)"
              echo "::error::$sm wants $want from $url"
            done
            echo "::error::if that commit is local-only, push it to its remote"
            exit 1
          fi
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential valgrind netcat-openbsd procps
      - name: build
        run: make all
      # exit 0 clean / 97 leak / 90 setup-unverified. 90 is a broken gate, not
      # a pass: the run did not prove anything, so it fails here too.
      - name: scripted valgrind run
        run: bash scripts/memcheck.sh --auto
      # The allocation-heavy functional load under valgrind — a different
      # shape of leak from the scripted run's.
      - name: valgrind under the functional suite
        working-directory: tests
        run: bash 11_memory_checks.sh

  docker:
    name: docker — images + in-container suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: fetch build submodules (public, over HTTPS)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # A gitlink pointing at a commit that was never pushed fails as
          # "upload-pack: not our ref <sha>", naming neither the submodule nor
          # the cause. Diagnose AFTER the fetch rather than before: a valid
          # gitlink is often a commit deep in history, which `git ls-remote`
          # does not list, so a pre-check on ref tips reports false failures.
          if ! git submodule update --init vendor/libcpp vendor/googletest; then
            for sm in vendor/libcpp vendor/googletest; do
              want="$(git ls-tree HEAD "$sm" | awk '{print $3}')"
              url="$(git config -f .gitmodules --get submodule."$sm".url)"
              echo "::error::$sm wants $want from $url"
            done
            echo "::error::if that commit is local-only, push it to its remote"
            exit 1
          fi
      # `--target test` compiles the full tier and runs the Google Test suite
      # inside the image; a test failure fails the build.
      - name: server image — run the test suite in-container
        run: docker build --target test -t ircserv-test .
      - name: server runtime image
        run: docker build -t ircserv .
      # The runtime image must actually serve, not merely build: the binary
      # moved to build/bin/ircserv, and a stale COPY would only show up here.
      - name: runtime image answers on the wire
        run: |
          docker run -d --name ircsmoke -p 6667:6667 ircserv 6667 ci-pass
          for i in $(seq 1 30); do
            if printf '' | nc -z 127.0.0.1 6667; then break; fi
            sleep 1
          done
          printf 'PASS ci-pass\r\nNICK ci\r\nUSER ci 0 * :CI\r\nQUIT\r\n' \
            | nc -q2 127.0.0.1 6667 | tee /tmp/out.txt
          grep -q ' 001 ' /tmp/out.txt \
            || { echo "::error::no RPL_WELCOME from the runtime image"; \
                 docker logs ircsmoke; exit 1; }
          docker rm -f ircsmoke
      - name: validate compose config
        run: docker compose config >/dev/null
